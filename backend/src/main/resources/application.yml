server:
  port: 8080

spring:
  application:
    name: carbar-server
  
  datasource:
    url: jdbc:mysql://localhost:3306/carbar_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.carbar: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: CarBarSecretKeyForJwtTokenGeneration2024ThisIsAVeryLongSecretKeyToEnsureSecurity
  expiration: 86400000
  header: Authorization
  prefix: Bearer 
